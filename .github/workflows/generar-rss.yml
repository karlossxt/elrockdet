name: Actualizar feed y Último Ruido
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Generar feed.xml
        run: python3 generate-rss.py

      - name: Actualizar Último Ruido
        shell: pwsh
        run: ./scripts/update-ultimo-ruido.ps1

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml index.html
          git diff --cached --quiet || git commit -m "Actualizar feed.xml y Último Ruido"
          git push
